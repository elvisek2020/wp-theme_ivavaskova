# Vydání pluginu a šablony z tagu vX.Y.Z (šablona workflow ze skillu wp-custom-theme).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PHP_VERSION: "8.5"   # = verze PHP na produkci (WEDOS); při změně na hostingu změň i tady
  REQUIRE_THEME: "0"   # THEME — "1" = šablona musí být v repu

jobs:
  release:
    name: Build & publish release ZIPs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Kontrola verze (tag = Version pluginu i všech šablon)
        run: |
          case "$PHP_VERSION" in *x*) echo "::error::PHP_VERSION nahoře ve workflow nastav na verzi PHP produkce"; exit 1;; esac
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(grep -m1 -E '^ \* Version:' plugins/ivavaskova-core/ivavaskova-core.php | awk '{print $3}')
          [ "$TAG" = "$CORE" ] || { echo "::error::Tag v$TAG ≠ Version pluginu $CORE"; exit 1; }
          # Každá šablona theme/*/style.css má verzi = tag (víc šablon jednoho webu = nový vzhled vedle starého).   # THEME
          FOUND=0   # THEME
          for CSS in theme/*/style.css; do   # THEME
            [ -f "$CSS" ] || continue; FOUND=1   # THEME
            THEME=$(grep -m1 -E '^Version:' "$CSS" | awk '{print $2}')   # THEME
            [ "$TAG" = "$THEME" ] || { echo "::error::Tag v$TAG ≠ Version šablony $THEME ($CSS)"; exit 1; }   # THEME
          done   # THEME
          if [ "$FOUND" = "0" ] && [ "$REQUIRE_THEME" = "1" ]; then echo "::error::Chybí theme/*/style.css"; exit 1; fi   # THEME
          [ "$FOUND" = "1" ] || echo "::notice::Šablona v repu zatím není, vydává se jen plugin."   # THEME

      # PHP připnuté podle produkce: ubuntu-latest se posouvá a s ním i předinstalované PHP.
      - name: PHP ${{ env.PHP_VERSION }} (jako na produkci)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: none

      - name: Kontrola syntaxe PHP ${{ env.PHP_VERSION }}
        run: |
          php -v | head -n1
          for d in plugins theme; do
            if [ -d "$d" ]; then find "$d" -name '*.php' -print0; fi
          done | xargs -0 -n1 php -l

      - name: Sestavení ZIPů
        run: |
          (cd plugins && zip -rq ../ivavaskova-core.zip ivavaskova-core -x '*/.DS_Store')
          for CSS in theme/*/style.css; do   # ZIP = složka šablony, updater ho nabídne šabloně téhož názvu   # THEME
            [ -f "$CSS" ] || continue   # THEME
            T=$(basename "$(dirname "$CSS")")   # THEME
            (cd theme && zip -rq "../$T.zip" "$T" -x '*/.DS_Store' -x "$T/README.md" -x "$T/.gitkeep")   # THEME
          done   # THEME

      # Text vydání = sekce „## vX.Y.Z — RRRR-MM-DD“ z CHANGELOG.md.
      # Bez sekce zůstanou jen automaticky generované poznámky.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $1 == "##" { if (found) exit; if ($2 == tag) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "Release notes for $GITHUB_REF_NAME:"; cat release-notes.md
          else
            echo "::warning::CHANGELOG.md nemá sekci ## $GITHUB_REF_NAME"
          fi

      - name: GitHub Release s ZIPy
        uses: softprops/action-gh-release@v3
        with:
          files: "*.zip"
          body_path: release-notes.md
          generate_release_notes: true
